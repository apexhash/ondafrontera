<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 EN VIVO — Onda Frontera</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            background: linear-gradient(135deg, #0f1e33 0%, #1a3555 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 18px;
        }
        .logo-imagen {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.25);
            margin-top: 10px;
        }
        .espacio-auspiciante {
            width: 100%;
            max-width: 550px; /* ✅ Agrandado también para acompañar */
            background: rgba(255, 215, 0, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.35);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            color: #ffd700;
        }
        .etiqueta-patrocinador {
            font-size: 11px;
            color: #ffd700;
            opacity: 0.8;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .contenedor-carrusel {
            position: relative;
            width: 100%;
            max-width: 517px; /* ✅ 470px + 10% = 517px */
            height: 198px;    /* ✅ 180px + 10% = 198px */
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
        }
        .carrusel {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
        }
        .enlace-diapositiva {
            display: block;
            width: 50%;
            height: 100%;
            cursor: pointer;
            text-decoration: none;
        }
        .diapositiva {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.3s ease;
        }
        .enlace-diapositiva:hover .diapositiva {
            opacity: 0.92;
        }
        .puntos-carrusel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .punto {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: all 0.3s;
        }
        .punto.activo {
            background: #ffd700;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.7);
        }
        .contenedor-reproductores {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 620px;
        }
        .player-box {
            flex: 1 1 260px;
            min-width: 260px;
            max-width: 295px;
            background: rgba(0, 0, 0, 0.65);
            padding: 17px 11px;
            border-radius: 14px;
            box-shadow: 0 6px 21px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
        }
        .titulo-reproductor {
            color: #ffd700;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 11px;
            letter-spacing: 1px;
            line-height: 1.4;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(220, 20, 60, 0.9);
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 50px;
            margin-bottom: 12px;
            animation: pulse 2s infinite;
        }
        .live-dot {
            width: 6px; height: 6px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite alternate;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(220, 20, 60, 0.4); }
            50% { box-shadow: 0 0 25px rgba(220, 20, 60, 0.6); }
        }
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .reproductor-centro {
            display: flex; flex-direction: column;
            align-items: center; margin: 7px 0;
        }
        .boton-play-triangulo {
            width: 44px; height: 44px; border: none;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 13px rgba(26, 115, 232, 0.4);
            transition: transform 0.2s ease;
        }
        .boton-play-triangulo:active { transform: scale(0.95); }
        .triangulo {
            width: 0; height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid white;
            margin-left: 3px;
        }
        .boton-play-triangulo.reproduciendo .triangulo {
            border: none; width: 13px; height: 15px;
            background: white;
            clip-path: polygon(0 0, 35% 0, 35% 100%, 0 100%, 65% 0, 100% 0, 100% 100%, 65% 100%);
        }
        audio { display: none; }
        .agradecimiento {
            max-width: 320px;
            text-align: center;
            color: #ffd700;
            font-size: 11px;
            font-weight: 600;
            padding: 12px 15px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-top: 8px;
            line-height: 1.5;
        }
        .error-message {
            margin-top: 10px;
            color: #ffb5bf;
            font-size: 10px;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <img src="https://github.com/milanmilano12222-stack/Ondafrontera/raw/main/IMG-20260818-WA0039.jpg" alt="Onda Frontera" class="logo-imagen">
    <!-- 🎠 CARRUSEL DE AUSPICIANTES -->

            <div class="reproductor-centro">

                    Tu navegador no soporta audio.
                
                <p class="error-message" id="error4"></p>

    </div>
    <!-- AGRADECIMIENTO -->
    <p class="agradecimiento">
        ✨ Esta radio online ha sido creado gracias al apoyo de Marcos Velázquez ✨
    </p>
    <script>
        // 🎠 LÓGICA DEL CARRUSEL
        const carrusel = document.getElementById('carrusel');
        const puntos = document.querySelectorAll('.punto');
        let indiceActual = 0;
        const totalImagenes = 2;
        function mostrarDiapositiva(indice) {
            carrusel.style.transform = `translateX(-${indice * 50}%)`;
            puntos.forEach((punto, i) => {
                punto.classList.toggle('activo', i === indice);
            });
            indiceActual = indice;
        }
        function siguienteDiapositiva() {
            const siguiente = (indiceActual + 1) % totalImagenes;
            mostrarDiapositiva(siguiente);
        }
        puntos.forEach(punto => {
            punto.addEventListener('click', () => {
                mostrarDiapositiva(parseInt(punto.dataset.indice));
            });
        });
        setInterval(siguienteDiapositiva, 5000);
        // 🎵 FUNCIÓN COMÚN — PAUSAR TODOS LOS DEMÁS
        function detenerTodosMenos(excepcionId) {
            ['audio1','audio2','audio3','audio4'].forEach(id => {
                if (id !== excepcionId) {
                    const el = document.getElementById(id);
                    const btnId = 'botonPlay' + id.replace('audio','');
                    const btn = document.getElementById(btnId);
                    el.pause();
                    btn.classList.remove('reproduciendo');
                }
            });
        }
        // 📡 REPRODUCTOR 1 — ONDA FRONTERA
        const audio1 = document.getElementById('audio1');
        const botonPlay1 = document.getElementById('botonPlay1');
        const error1 = document.getElementById('error1');
        botonPlay1.addEventListener('click', async () => {
            error1.textContent = '';
            if (audio1.paused) {
                try {
                    detenerTodosMenos('audio1');
                    await audio1.play();
                    botonPlay1.classList.add('reproduciendo');
                } catch {
                    error1.textContent = 'Señal no disponible.';
                }
            } else {
                audio1.pause();
                botonPlay1.classList.remove('reproduciendo');
            }
        });
        audio1.addEventListener('error', () => {
            error1.textContent = 'Señal no disponible.';
            botonPlay1.classList.remove('reproduciendo');
        });
        // 🎙️ REPRODUCTOR 2 — REGUETÓN
        const audio2 = document.getElementById('audio2');
        const botonPlay2 = document.getElementById('botonPlay2');
        const error2 = document.getElementById('error2');
        botonPlay2.addEventListener('click', async () => {
            error2.textContent = '';
            if (audio2.paused) {
                try {
                    detenerTodosMenos('audio2');
                    await audio2.play();
                    botonPlay2.classList.add('reproduciendo');
                } catch {
                    error2.textContent = 'Señal no disponible.';
                }
            } else {
                audio2.pause();
                botonPlay2.classList.remove('reproduciendo');
            }
        });
        audio2.addEventListener('error', () => {
            error2.textContent = 'Señal no disponible.';
            botonPlay2.classList.remove('reproduciendo');
        });
        // 🪗 REPRODUCTOR 3 — CUMBIA
        const audio3 = document.getElementById('audio3');
        const botonPlay3 = document.getElementById('botonPlay3');
        const error3 = document.getElementById('error3');
        botonPlay3.addEventListener('click', async () => {
            error3.textContent = '';
            if (audio3.paused) {
                try {
                    detenerTodosMenos('audio3');
                    await audio3.play();
                    botonPlay3.classList.add('reproduciendo');
                } catch {
                    error3.textContent = 'Señal no disponible.';
                }
            } else {
                audio3.pause();
                botonPlay3.classList.remove('reproduciendo');
            }
        });
        audio3.addEventListener('error', () => {
            error3.textContent = 'Señal no disponible.';
            botonPlay3.classList.remove('reproduciendo');
        });
        // 🤠 REPRODUCTOR 4 — SERTANEJO BRASILEÑO
        const audio4 = document.getElementById('audio4');
        const botonPlay4 = document.getElementById('botonPlay4');
        const error4 = document.getElementById('error4');
        botonPlay4.addEventListener('click', async () => {
            error4.textContent = '';
            if (audio4.paused) {
                try {
                    detenerTodosMenos('audio4');
                    await audio4.play();
                    botonPlay4.classList.add('reproduciendo');
                } catch {
                    error4.textContent = 'Señal no disponible.';
                }
            } else {
                audio4.pause();
                botonPlay4.classList.remove('reproduciendo');
            }
        });
        audio4.addEventListener('error', () => {
            error4.textContent = 'Señal no disponible.';
            botonPlay4.classList.remove('reproduciendo');
        });
    </script>
